services:
  anunciador:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - anunciador

volumes:
  caddy_data:
  caddy_config:
