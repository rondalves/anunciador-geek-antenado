<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anunciador — Geek Antenado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0c0e12; --painel:#161a21; --linha:#2a313c;
  --ciano:#2ee6d6; --amarelo:#ffd426; --verde:#4ade80; --erro:#ff6f61;
  --texto:#eef2f7; --suave:#8b96a5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Archivo,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 18px}
h1{font-family:"Archivo Black";font-size:24px;margin:0 0 2px;letter-spacing:-.02em;text-align:center}
h1 em{font-style:normal;color:var(--ciano)}
#conexoes{font-size:12.5px;color:var(--suave);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.pino{display:inline-flex;align-items:center;gap:5px}
.pino i{width:7px;height:7px;border-radius:50%;background:var(--erro);display:inline-block}
.pino.on i{background:var(--verde)}
a{color:var(--ciano)}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:26px;width:100%;max-width:480px}
label{display:block;font-size:12.5px;color:var(--suave);margin:16px 0 6px}
label:first-child{margin-top:0}
input:not([type=checkbox]),select{width:100%;background:#0a0c10;border:1px solid var(--linha);color:var(--texto);
  border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;appearance:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ciano);cursor:pointer}
select{background-image:linear-gradient(45deg,transparent 50%,var(--suave) 50%),linear-gradient(135deg,var(--suave) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 2px),calc(100% - 14px) calc(50% + 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;cursor:pointer}
input:focus,select:focus{outline:none;border-color:var(--ciano);box-shadow:0 0 0 3px rgba(46,230,214,.15)}

/* fila de produtos */
#fila{width:100%;max-width:480px;margin-top:14px;display:none}
#fila.ver{display:block}
.itemFila{display:flex;align-items:center;gap:10px;background:var(--painel);border:1px solid var(--linha);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.itemFila .nome{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemFila .valores{font-size:12px;color:var(--suave);white-space:nowrap}
.itemFila button{background:transparent;color:var(--suave);font-size:20px;line-height:1;padding:0 4px;font-weight:400}
.itemFila button:hover{color:var(--erro)}
.contaFila{font-size:12.5px;color:var(--suave);margin:0 0 8px}
.secundario{background:#20252c;color:var(--texto);width:100%;padding:14px;font-size:15px;margin-top:12px}
.secundario:hover:not(:disabled){filter:brightness(1.25)}
.secundario:disabled{opacity:.5;cursor:not-allowed}

/* bloco do Mercado Livre */
#blocoML{margin-top:20px;padding-top:18px;border-top:1px solid var(--linha)}
#blocoML.carregando{opacity:.5}
.tituloML{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--suave);margin-bottom:10px}
.selo{background:rgba(46,230,214,.12);color:var(--ciano);border-radius:6px;padding:2px 8px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em}
.campoML label{margin-top:12px}
.campoML:first-child label{margin-top:0}
.auto{color:var(--verde);font-size:11px;font-weight:600;margin-left:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;align-items:end}
.duo label{margin-top:0}
.precoLinha{position:relative}
.precoLinha span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--suave);
  font-size:13px;pointer-events:none;font-weight:600}
.precoLinha input{padding-left:74px;text-align:right}
.dica{font-size:12px;color:var(--suave);margin-top:6px}
.check{display:flex;align-items:center;gap:9px;margin:18px 0 4px;font-size:14.5px}
.check input{width:auto}
button{font:inherit;font-weight:700;border-radius:12px;border:none;cursor:pointer}
.anunciar{background:var(--amarelo);color:#15181d;width:100%;padding:17px;font-size:17px;margin-top:22px}
.anunciar:hover:not(:disabled){filter:brightness(1.07)}
.anunciar:disabled{opacity:.5;cursor:not-allowed}
.historico{width:100%;max-width:480px;margin-top:18px;font-size:12.5px;color:var(--suave)}
.historico div{padding:5px 0;border-bottom:1px solid var(--linha)}
.ruim{color:var(--erro)} .bom{color:var(--verde)}
/* progresso */
.fundoModal{position:fixed;inset:0;background:rgba(6,8,11,.85);display:none;place-items:center;padding:20px;z-index:20}
.fundoModal.ver{display:grid}
.modal{background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:28px;width:min(440px,100%)}
.pct{font-family:"Archivo Black";font-size:32px}
.barra{height:8px;border-radius:99px;background:#0a0c10;overflow:hidden;margin:14px 0 6px}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ciano),var(--amarelo));transition:width .35s ease}
.passos{margin-top:14px;font-size:13px;max-height:200px;overflow:auto}
.passos div{padding:3px 0;color:var(--suave)}
.passos div.erro{color:var(--erro)}
#final b{font-size:15px}
#final .linha{padding:7px 0;border-top:1px solid var(--linha)}
#final .linha:first-child{border-top:none}
.rodapeModal{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.rodapeModal button{padding:11px 18px;background:#20252c;color:var(--texto)}
.rodapeModal button.acao{background:var(--amarelo);color:#15181d}
</style>
</head>
<body>
<h1>Anunciador <em>Geek Antenado</em></h1>
<div id="conexoes">verificando…</div>

<div class="cartao">
  <label for="titulo">Nome do produto</label>
  <input id="titulo" placeholder="Redmi Note 14 Pro 5G 8GB+256GB" autofocus>

  <label for="pasta">Pasta de fotos no Drive</label>
  <input id="pasta" placeholder="link da pasta">
  <div class="dica">Busca as fotos pelo nome do produto — arquivos como <b>Nome do Produto (1).jpg</b></div>

  <div class="duo">
    <div>
      <label for="ean">EAN da caixa <span style="color:var(--suave);font-weight:400">(quando tiver)</span></label>
      <input id="ean" inputmode="numeric" placeholder="opcional">
    </div>
    <div>
      <label for="estoque">Quantidade</label>
      <input id="estoque" type="number" min="1" step="1" value="1">
    </div>
  </div>

  <label>Preço</label>
  <div class="duo" style="margin-top:0">
    <div class="precoLinha"><span>Shopify</span><input id="precoShopify" type="number" step="0.01" placeholder="0,00"></div>
    <div class="precoLinha"><span>ML</span><input id="precoML" type="number" step="0.01" placeholder="0,00"></div>
  </div>
  <div class="dica">Deixe um dos dois em branco para anunciar só na outra plataforma.</div>

  <div class="check"><input type="checkbox" id="usado" checked><label for="usado" style="margin:0;color:var(--texto)">Produto usado (testes do canal)</label></div>

  <div id="blocoML" hidden>
    <div class="tituloML"><span class="selo">Mercado Livre</span><span id="catML"></span></div>
    <div id="trocaCat" hidden>
      <label for="selCat">Categoria</label>
      <select id="selCat"></select>
    </div>
    <div id="atributosML"></div>
    <div class="dica" id="dicaML"></div>
  </div>

  <button class="secundario" id="btAdicionar">+ Adicionar outro produto</button>
  <button class="anunciar" id="btAnunciar">Anunciar</button>
</div>

<div id="fila"></div>

<div class="historico" id="historico"></div>

<div class="fundoModal" id="modal">
  <div class="modal">
    <div class="pct" id="pct">0%</div>
    <div class="barra"><i id="barra"></i></div>
    <div id="rotulo" class="dica">preparando…</div>
    <div class="passos" id="passos"></div>
    <div id="final" hidden style="margin-top:16px;font-size:14px"></div>
    <div class="rodapeModal" id="rodapeModal" hidden>
      <button onclick="novoAnuncio()">Novo anúncio</button>
      <button class="acao" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const brl = n => (n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let avisoIA = "";

fetch("/api/status").then(r => r.json()).then(s => {
  const pino = (nome, ok) => `<span class="pino ${ok ? "on" : ""}"><i></i>${nome}</span>`;
  $("conexoes").innerHTML = pino("Shopify", s.shopify) + pino("Drive", s.drive) + pino("Mercado Livre", s.ml) +
    (s.shopify ? "" : ' <a href="/auth/shopify">conectar</a>') +
    (s.ml ? "" : ' <a href="/auth/ml">conectar ML</a>') +
    (s.driveConectar ? ' <a href="/auth/google" style="font-weight:700">→ conectar Google (necessário pra baixar fotos)</a>' : "");
  if (s.pastaPadrao) $("pasta").value = s.pastaPadrao;
});

let atributosML = [], categoriaML = "";

// ao sair do nome do produto, mostra em que categoria vai cair e o que o ML exige
async function preverML(categoriaEscolhida) {
  const nome = $("titulo").value.trim();
  if (!nome) return;
  $("blocoML").hidden = false;
  $("blocoML").classList.add("carregando");
  $("catML").textContent = "consultando categoria…";
  $("dicaML").textContent = "";
  try {
    const j = await (await fetch(`/api/ml/preview?nome=${encodeURIComponent(nome)}` +
      (categoriaEscolhida ? `&categoria=${encodeURIComponent(categoriaEscolhida)}` : ""))).json();
    if (!j.ok) throw new Error(j.erro);
    categoriaML = j.categoria.id;
    atributosML = j.atributos;
    $("catML").textContent = j.categoria.nome;

    // a deteccao de categoria do ML erra bastante — deixa trocar sem sair da tela
    if (j.alternativas && j.alternativas.length) {
      $("trocaCat").hidden = false;
      $("selCat").innerHTML = [j.categoria, ...j.alternativas]
        .map((c, i) => `<option value="${c.id}"${i ? "" : " selected"}>${c.nome}</option>`).join("");
      $("selCat").onchange = () => preverML($("selCat").value);
    } else $("trocaCat").hidden = true;

    if (!atributosML.length) {
      $("atributosML").innerHTML = "";
      $("dicaML").textContent = "Essa categoria nao exige nada alem de marca, modelo e EAN.";
      return;
    }
    $("atributosML").innerHTML = atributosML.map(a => {
      const marca = a.origem ? `<span class="auto">preenchido (${a.origem})</span>` : "";
      const rotulo = `<label for="at_${a.id}">${a.nome}${marca}</label>`;
      if (a.valores.length) {
        const ops = a.valores.map(v =>
          `<option value="${v.id}"${String(v.id) === String(a.sugerido) ? " selected" : ""}>${v.nome}</option>`).join("");
        return `<div class="campoML">${rotulo}<select id="at_${a.id}" data-attr="${a.id}" data-tipo="${a.tipo}"><option value="">— escolha —</option>${ops}</select></div>`;
      }
      return `<div class="campoML">${rotulo}<input id="at_${a.id}" data-attr="${a.id}" data-tipo="${a.tipo}" value="${a.sugerido || ""}" placeholder="${a.tipo === "number_unit" ? "ex.: 128 GB" : ""}"></div>`;
    }).join("");
    const vazios = atributosML.filter(a => !a.sugerido).length;
    $("dicaML").innerHTML = vazios
      ? `<span class="ruim">Escolha ${vazios} campo(s)</span> — sem isso o Mercado Livre recusa o anuncio.`
      : "Tudo pronto. Confira os valores e clique em Anunciar.";
  } catch (e) {
    $("catML").textContent = "";
    $("dicaML").innerHTML = `<span class="ruim">${e.message}</span>`;
  } finally { $("blocoML").classList.remove("carregando"); }
}
$("titulo").addEventListener("blur", () => preverML());
$("titulo").addEventListener("input", desenharFila);

function coletarAtributosML() {
  return [...document.querySelectorAll("#atributosML [data-attr]")]
    .filter(el => el.value.trim())
    .map(el => el.tagName === "SELECT" && el.dataset.tipo !== "number_unit" && el.dataset.tipo !== "boolean"
      ? { id: el.dataset.attr, value_id: el.value }
      : { id: el.dataset.attr, value_name: (el.selectedOptions ? el.selectedOptions[0].textContent : el.value).trim() });
}

let fila = [];

// tira do formulário um produto pronto, ou null com o motivo em alert.
// Cada produto leva a categoria e os atributos que foram resolvidos PARA ELE.
function produtoDoFormulario() {
  const titulo = $("titulo").value.trim();
  const precoShopify = parseFloat($("precoShopify").value) || 0;
  const precoML = parseFloat($("precoML").value) || 0;
  if (!titulo) { alert("Falta o nome do produto."); return null; }
  if (!precoShopify && !precoML) { alert("Preencha o preço de pelo menos uma plataforma."); return null; }
  if (!$("pasta").value.trim()) { alert("Falta a pasta de fotos."); return null; }
  // barra aqui em vez de deixar o ML recusar depois de subir todas as fotos
  if (precoML > 0 && atributosML.length) {
    const preenchidos = new Set(coletarAtributosML().map(a => a.id));
    const vazios = atributosML.filter(a => !preenchidos.has(a.id)).map(a => a.nome);
    if (vazios.length) { alert(`O Mercado Livre exige: ${vazios.join(", ")}.\nPreencha antes de anunciar.`); return null; }
  }
  const partes = titulo.split(" ");
  return {
    titulo, tituloML: titulo.slice(0, 60), marca: partes[0] || "", modelo: partes.slice(1).join(" ") || titulo,
    categoria: "", categoriaML, ean: $("ean").value,
    estoque: Math.max(1, parseInt($("estoque").value, 10) || 1),
    precoShopify: precoShopify || undefined, precoML: precoML || undefined,
    usado: $("usado").checked, intro: "", fechamento: "", destaques: [],
    tags: [], fotos: [], atributosML: coletarAtributosML(),
    garantiaTipo: "Garantia do vendedor", garantiaTempo: "30 dias", freteGratis: false,
    shopify: precoShopify > 0, ml: precoML > 0
  };
}

function limparFormulario() {
  ["titulo", "ean", "precoShopify", "precoML"].forEach(i => $(i).value = "");
  $("estoque").value = "1";
  $("blocoML").hidden = true; $("atributosML").innerHTML = ""; $("trocaCat").hidden = true;
  atributosML = []; categoriaML = "";
}

function desenharFila() {
  $("fila").classList.toggle("ver", fila.length > 0);
  // o formulário só conta se tiver produto digitado
  const total = fila.length + ($("titulo").value.trim() ? 1 : 0);
  $("btAnunciar").textContent = total > 1 ? `Anunciar ${total} produtos` : "Anunciar";
  if (!fila.length) return $("fila").innerHTML = "";
  $("fila").innerHTML = `<div class="contaFila">${fila.length} produto(s) na fila${$("titulo").value.trim() ? " — o do formulário entra junto" : ""}</div>` +
    fila.map((p, i) => `<div class="itemFila">
      <span class="nome">${p.titulo}</span>
      <span class="valores">${[p.estoque > 1 && `${p.estoque}un`, p.precoShopify && "Shopify " + brl(p.precoShopify), p.precoML && "ML " + brl(p.precoML)].filter(Boolean).join(" · ")}</span>
      <button title="tirar da fila" onclick="tirarDaFila(${i})">&times;</button>
    </div>`).join("");
}
function tirarDaFila(i) { fila.splice(i, 1); desenharFila(); }

function adicionarProduto() {
  const p = produtoDoFormulario();
  if (!p) return;
  fila.push(p);
  limparFormulario();
  desenharFila();
  $("titulo").focus();
}

async function anunciar() {
  avisoIA = "";
  // o que está no formulário entra na fila; se o formulário estiver vazio, publica só a fila
  const lista = [...fila];
  if ($("titulo").value.trim()) {
    const p = produtoDoFormulario();
    if (!p) return;
    lista.push(p);
  }
  if (!lista.length) return alert("Nenhum produto para anunciar.");

  const b = $("btAnunciar"); b.disabled = true; b.textContent = "Buscando fotos…";
  $("btAdicionar").disabled = true;
  $("modal").classList.add("ver");
  $("passos").innerHTML = ""; $("final").hidden = true; $("rodapeModal").hidden = true;
  $("barra").style.width = "5%"; $("pct").textContent = "5%";

  try {
    const pasta = $("pasta").value;
    for (const [i, p] of lista.entries()) {
      $("rotulo").textContent = `buscando fotos de ${p.titulo} (${i + 1} de ${lista.length})…`;
      const jf = await (await fetch(`/api/fotos?pasta=${encodeURIComponent(pasta)}&nome=${encodeURIComponent(p.titulo)}`)).json();
      if (!jf.ok) throw new Error(`${p.titulo}: ${jf.erro}`);
      p.fotos = jf.files.map(f => f.url);
      if (!p.fotos.length) throw new Error(`Nenhuma foto encontrada para "${p.titulo}" nessa pasta. Confira o nome dos arquivos.`);

      $("rotulo").textContent = `escrevendo descrição de ${p.titulo}…`;
      try {
        const jt = await (await fetch("/api/gerar-texto", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ titulo: p.titulo, categoria: "", ficha: "" })
        })).json();
        if (jt.ok) {
          p.intro = jt.intro || ""; p.destaques = jt.destaques || []; p.fechamento = jt.fechamento || "";
          if (jt.titulo_ml) p.tituloML = jt.titulo_ml.slice(0, 60);
        } else if (!avisoIA) avisoIA = jt.erro || "falhou sem detalhe";
      } catch (e) { if (!avisoIA) avisoIA = "não consegui falar com a IA: " + e.message; }
      $("barra").style.width = `${5 + Math.round((i + 1) / lista.length * 10)}%`;
    }

    b.textContent = "Publicando…";
    const j = await (await fetch("/api/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ produtos: lista })
    })).json();
    acompanhar(j.job);
  } catch (e) {
    $("rotulo").innerHTML = `<span class="ruim">${e.message}</span>`;
    $("rodapeModal").hidden = false;
    b.disabled = false; $("btAdicionar").disabled = false; desenharFila();
  }
}
$("btAnunciar").onclick = anunciar;
$("btAdicionar").onclick = adicionarProduto;

function acompanhar(job) {
  const es = new EventSource(`/api/progresso/${job}`);
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.tipo === "etapa") {
      $("barra").style.width = d.pct + "%"; $("pct").textContent = d.pct + "%";
      $("rotulo").textContent = d.texto;
      $("passos").insertAdjacentHTML("beforeend", `<div>${d.texto}</div>`);
      $("passos").scrollTop = 1e6;
    }
    if (d.tipo === "falha" || d.tipo === "erro")
      $("passos").insertAdjacentHTML("beforeend", `<div class="erro">${d.alvo ? d.alvo + ": " : ""}${d.texto}</div>`);
    if (d.tipo === "fim") { es.close(); finalizar(d.resultados || [d.resultado]); }
  };
  es.onerror = () => es.close();
}

function acaoParaErro(msg) {
  if (/shopify.*conectad|abra.*auth\/shopify/i.test(msg))
    return ` <a href="/auth/shopify" target="_blank" style="font-weight:700">→ Clique aqui pra reconectar a Shopify</a>`;
  if (/refresh token do ml|mercado livre não conectad|abra.*auth\/ml/i.test(msg))
    return ` <a href="/auth/ml" target="_blank" style="font-weight:700">→ Clique aqui pra reconectar o Mercado Livre</a>`;
  if (/drive recusou|auth\/google/i.test(msg))
    return ` <a href="/auth/google" target="_blank" style="font-weight:700">→ Clique aqui pra conectar o Google com login (resolve download de foto)</a>`;
  if (/gemini|anthropic|ia não devolveu|quota|high demand/i.test(msg))
    return ` <span class="dica">A descrição automática depende do Gemini. O anúncio sai do mesmo jeito com o texto básico — tente de novo em alguns minutos se quiser a descrição completa.</span>`;
  if (/nenhuma foto|sem fotos/i.test(msg))
    return ` <span class="dica">Confira se os arquivos na pasta do Drive estão nomeados como "${$("titulo").value} (1).jpg", "(2).jpg"...</span>`;
  return "";
}

function finalizar(lista) {
  $("barra").style.width = "100%"; $("pct").textContent = "100%";
  const ok = lista.filter(r => r.shopify?.ok || r.ml?.ok).length;
  $("rotulo").textContent = lista.length > 1 ? `concluído — ${ok} de ${lista.length} publicados` : "concluído";

  const l = [];
  if (avisoIA) l.push(`<span class="ruim">Descrição automática falhou:</span> <span class="dica">${avisoIA}</span> — publicado com a descrição montada do título.`);
  for (const r of lista) {
    l.push(`<b>${r.produto}</b>`);
    if (r.erro) l.push(`<span class="ruim">${r.erro}</span>${acaoParaErro(r.erro)}`);
    if (r.shopify) l.push(r.shopify.ok
      ? `<span class="bom">Shopify ${r.shopify.rascunho ? "em rascunho" : "publicado"}</span> — <a href="${r.shopify.admin}" target="_blank">abrir</a> (${brl(r.precoShopify)})`
      : `<span class="ruim">Shopify:</span> ${r.shopify.erro}${acaoParaErro(r.shopify.erro)}`);
    if (r.ml) l.push(r.ml.ok
      ? `<span class="bom">Mercado Livre ${r.ml.status}</span> — <a href="${r.ml.url}" target="_blank">ver anúncio</a> (${brl(r.precoML)})`
      : `<span class="ruim">Mercado Livre:</span> ${r.ml.erro}${acaoParaErro(r.ml.erro)}`);
    (r.avisos || []).forEach(a => l.push(`<span class="dica">${a}</span>`));
  }
  $("final").innerHTML = l.map(x => `<div class="linha">${x}</div>`).join(""); $("final").hidden = false; $("rodapeModal").hidden = false;
  // o que foi publicado sai da fila; o que falhou fica para você tentar de novo
  fila = fila.filter(p => {
    const r = lista.find(x => x.produto === (p.titulo || "").toUpperCase());
    return r && !(r.shopify?.ok || r.ml?.ok);
  });
  $("btAnunciar").disabled = false; $("btAdicionar").disabled = false;
  desenharFila();
  historico();
}

const fecharModal = () => $("modal").classList.remove("ver");
function novoAnuncio() {
  limparFormulario();
  fila = []; desenharFila();
  fecharModal(); $("titulo").focus();
}

async function historico() {
  const h = await (await fetch("/api/historico")).json();
  $("historico").innerHTML = h.length ? h.slice(0, 6).map(x =>
    `<div>${new Date(x.data).toLocaleDateString("pt-BR")} · ${x.produto} · ` +
    ([x.shopify?.ok && "Shopify", x.ml?.ok && "ML"].filter(Boolean).join(" + ") || '<span class="ruim">falhou</span>') + `</div>`
  ).join("") : "";
}
historico();
</script>
